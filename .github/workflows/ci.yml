name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # pure-Python install: the Rust parity tests are skipped here
      - run: uv sync --extra mcp --group dev --group experiments
      - run: uv run pytest

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test --release
        working-directory: rust
      - uses: astral-sh/setup-uv@v6
      - name: build the extension with maturin and run the full suite
        run: |
          uv sync --all-extras --group dev --group experiments
          uv run python -c "import trial_ledger_core; print(trial_ledger_core.__version__)"
          uv run pytest

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra mcp --group dev --group experiments
      - name: replay every agent episode from the committed response cache
        run: uv run python -m experiments.run replay-check
      - name: recompute PBO from committed return objects
        run: uv run trial-ledger --dir experiments/results/causal-v2/runs/random-search/signflip-s0-r0/ledger pbo

  wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-15
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: build source distribution with the same notices
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: astral-sh/setup-uv@v6
      - name: install the built wheel and check NumPy parity
        run: |
          uv sync --extra mcp --group dev --group experiments
          uv run --no-sync python rust/check_licenses.py rust/dist/*
          uv pip install rust/dist/*.whl
          uv run --no-sync pytest tests/test_rust_parity.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: rust/dist/*
