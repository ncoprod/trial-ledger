[package]
name = "trial-ledger-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust core for trial-ledger: CSCV probability of backtest overfitting"
publish = false

[lib]
name = "trial_ledger_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = { version = "0.30.0", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3-py39"], optional = true }
rayon = "1.12.0"

[features]
default = []
# Python bindings; maturin enables this (see pyproject.toml). `cargo test` runs without it.
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
