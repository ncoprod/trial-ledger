[project]
name = "trial-ledger-core"
version = "0.1.0"
description = "Rust core for trial-ledger (CSCV probability of backtest overfitting)"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/**/*"]
authors = [{name = "Nicolas Coquelet"}]
dependencies = ["numpy>=1.21"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]
module-name = "trial_ledger_core"
