[project]
name = "trial-ledger"
version = "0.1.0"
description = "Count the backtests your AI agent actually ran: a tamper-evident trial ledger with Deflated Sharpe Ratio and PBO."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nico Coquelet", email = "cqltnico@gmail.com" }]
requires-python = ">=3.13"
keywords = ["backtest", "overfitting", "deflated-sharpe-ratio", "pbo", "mcp", "llm-agents", "multiple-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9"]  # 1.x (FastMCP) and 2.x (MCPServer) are both supported
fast = ["trial-ledger-core"]  # Rust CSCV core in rust/, built with maturin

[project.scripts]
trial-ledger = "trial_ledger.cli:main"
trial-ledger-mcp = "trial_ledger.mcp_server:main"
trial-ledger-hook = "trial_ledger.hooks:main"

[project.urls]
Repository = "https://github.com/ncoprod/trial-ledger"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
experiments = [
    "openai>=1.60",
    "matplotlib>=3.9",
]
# only for benchmarks/bench_pbo.py, which runs pypbo (AGPL, fetched at a pinned commit)
bench = [
    "pandas>=2.2",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "joblib>=1.4",
    "psutil>=6",
    "matplotlib>=3.9",
]

[tool.uv.sources]
trial-ledger-core = { path = "rust" }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_ledger"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# timing lambdas are called immediately inside the loop
"benchmarks/*" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
